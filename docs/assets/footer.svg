<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Decorative animated waves">
  <title>Animated waves</title>
  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lineC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="waveClip">
      <rect width="1200" height="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#waveClip)">
    <path d="M-80 86 C 90 40, 250 118, 420 84 S 720 42, 900 82 S 1120 110, 1280 66 V140 H-80 Z" fill="url(#waveB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 3;0 0" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 104 C 110 70, 280 128, 470 100 S 760 66, 950 102 S 1140 122, 1280 90" fill="none" stroke="url(#waveA)" stroke-width="1.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -4;0 0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 118 C 160 92, 320 138, 520 116 S 820 88, 1010 118 S 1160 128, 1280 108" fill="none" stroke="url(#lineC)" stroke-width="1" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
