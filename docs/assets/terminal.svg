<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="termTitle termDesc" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace">
  <title id="termTitle">Illustrative DeepSeek UI research session</title>
  <desc id="termDesc">Animated terminal: start the gateway, see the labelled local search provider, run web searches and fetches, create a cited artifact after approval, and finish a checkpoint.</desc>

  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="termGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="termFrame">
      <rect width="1040" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termFrame)">
    <rect width="1040" height="340" fill="url(#termBg)"/>
    <rect x="0" y="46" width="1040" height="294" fill="url(#termGlow)"/>

    <!-- Chrome -->
    <rect width="1040" height="46" fill="#0C1322"/>
    <line x1="0" y1="46" x2="1040" y2="46" stroke="#1B2740"/>
    <circle cx="24" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="23" r="6" fill="#28C840"/>
    <text x="520" y="27.5" text-anchor="middle" font-size="11.5" letter-spacing="0.8" fill="#5E7295">deepseek-ui · research session</text>

    <!-- Prompt -->
    <g>
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.35s" fill="freeze"/>
      <text x="30" y="90" font-size="14">
        <tspan fill="#22D3EE" font-weight="700">❯</tspan>
        <tspan fill="#E6EEFF" dx="8">npm run gateway</tspan>
      </text>
      <rect x="196" y="75" width="8" height="18" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="108" width="1040" height="1" fill="#131E33"/>

    <!-- Session log -->
    <g font-size="13.2">
      <g>
        <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.35s" fill="freeze"/>
        <text x="30" y="140">
          <tspan fill="#34D399" font-weight="700">✓</tspan>
          <tspan fill="#C9D6EE" dx="9">gateway ready</tspan>
          <tspan fill="#67E8F9" dx="14">http://127.0.0.1:8787</tspan>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.35s" fill="freeze"/>
        <text x="30" y="172">
          <tspan fill="#A78BFA" font-weight="700">◈</tspan>
          <tspan fill="#C9D6EE" dx="9">research</tspan>
          <tspan fill="#FBBF24" dx="26">local mock</tspan>
          <tspan fill="#5E7295" dx="10">· set TAVILY_API_KEY for live search</tspan>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.35s" fill="freeze"/>
        <text x="30" y="204">
          <tspan fill="#67E8F9" font-weight="700">◈</tspan>
          <tspan fill="#67E8F9" dx="9">web_search</tspan>
          <tspan fill="#DCE7FA" dx="24">"quantum error correction"</tspan>
          <tspan fill="#7DD3FC" dx="12">→ 6 sources</tspan>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.35s" fill="freeze"/>
        <text x="30" y="236">
          <tspan fill="#818CF8" font-weight="700">◈</tspan>
          <tspan fill="#C7D2FE" dx="9">web_fetch</tspan>
          <tspan fill="#DCE7FA" dx="29">example-science.org</tspan>
          <tspan fill="#A5B4FC" dx="20">→ 4,812 chars extracted</tspan>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.35s" fill="freeze"/>
        <text x="30" y="268">
          <tspan fill="#C084FC" font-weight="700">◈</tspan>
          <tspan fill="#E9D5FF" dx="9">artifact_create</tspan>
          <tspan fill="#DCE7FA" dx="14">"Quantum brief"</tspan>
          <tspan fill="#FBBF24" dx="12">→ approval</tspan>
          <tspan fill="#6EE7B7" dx="6">→ approved</tspan>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" from="0" to="1" begin="3.85s" dur="0.35s" fill="freeze"/>
        <text x="30" y="300">
          <tspan fill="#34D399" font-weight="700">◈</tspan>
          <tspan fill="#BBF7D0" dx="9">checkpoint</tspan>
          <tspan fill="#6EE7B7" dx="18">completed</tspan>
          <tspan fill="#5E7295" dx="10">· citations [1–6] preserved</tspan>
        </text>
      </g>
    </g>

    <!-- Blinking cursor after the last line -->
    <rect x="474" y="286" width="8" height="17" fill="#34D399">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" begin="4.3s" repeatCount="indefinite"/>
    </rect>

    <!-- Slow sheen -->
    <rect x="-320" y="46" width="320" height="294" fill="url(#sheen)">
      <animate attributeName="x" values="-320;1040" dur="7.5s" begin="1s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="1039" height="339" rx="17.5" fill="none" stroke="#1B2740"/>
  </g>
</svg>
